name: kombat
description: "A Mortal Kombat-style fighting game built with Flutter and Flame 3D"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.31.0
  flame_3d: 0.3.0
  audioplayers: ^5.2.0
  vector_math: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/generic/
    - assets/models/generic/textures/
    - assets/models/arena/
    - assets/images/ui/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/fonts/
